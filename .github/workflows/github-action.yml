name: Wayshub Backend Github Action

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Login ke Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build dan Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wayshub-backend:dev

  deploy-app:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # 5. Deploy Aplikasi via SSH
      - name: Deploy to Server via Terminal
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USERNAME }}
          key: ${{ secrets.APP_SSH_KEY }}
          port: ${{ secrets.APP_PORT }}
          script: |
            cd ${{ secrets.APP_DIREKTORY }}
            docker compose pull
            docker compose down
            docker compose up -d

  notif-discord:
    runs-on: ubuntu-latest
    needs: deploy-app
    if: always()
    steps:
      # 6. Kirim Notifikasi ke Discord saat Sukses
      - name: Discord Notification on Success
        if: ${{ needs.deploy-app.result == 'success' }}
        uses: appleboy/discord-action@master
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          message: "🚀 CI/CD Wayshub Backend Sukses! Aplikasi `wayshub-backend` berhasil di-deploy di server."

      # 7. Kirim Notifikasi ke Discord saat Gagal
      - name: Discord Notification on Failure
        if: ${{ needs.deploy-app.result == 'failure' || needs.build-and-push.result == 'failure' }}
        uses: appleboy/discord-action@master
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          message: "❌ CI/CD Wayshub Backend Gagal! Proses CI/CD `wayshub-backend` gagal pada pipeline."
